[alembic]
# Alembic 會從 server 資料夾執行，migration 檔案放在 alembic/。
script_location = alembic
prepend_sys_path = .
sqlalchemy.url = postgresql+psycopg://sanba_app:password@localhost:5432/sanba_ahou

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
